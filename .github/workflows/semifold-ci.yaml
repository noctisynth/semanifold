name: Semifold CI
on:
  push:
    branches: [main]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CLICOLOR_FORCE: 1

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: semifold-linux-x86_64
            napi_source: libsemifold_napi.so
            napi_artifact_name: semifold.linux-x64-gnu.node
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: semifold-linux-arm64
            napi_source: libsemifold_napi.so
            napi_artifact_name: semifold.linux-arm64-gnu.node
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: semifold-macos-x86_64
            napi_source: libsemifold_napi.dylib
            napi_artifact_name: semifold.darwin-x64.node
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: semifold-macos-arm64
            napi_source: libsemifold_napi.dylib
            napi_artifact_name: semifold.darwin-arm64.node
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: x64
            artifact_name: semifold-windows-x86_64.exe
            napi_source: semifold_napi.dll
            napi_artifact_name: semifold.win32-x64-msvc.node
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            arch: arm64
            artifact_name: semifold-windows-arm64.exe
            napi_source: semifold_napi.dll
            napi_artifact_name: semifold.win32-arm64-msvc.node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: mlugg/setup-zig@v2
      - name: Setup Zigbuild (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip3 install cargo-zigbuild
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build with cargo-zigbuild (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Build
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: mv target/${{ matrix.target }}/release/semifold${{ matrix.os == 'windows-latest' && '.exe' || '' }} target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
      - name: Rename N-API binding
        run: mv target/${{ matrix.target }}/release/${{ matrix.napi_source }} target/${{ matrix.target }}/release/${{ matrix.napi_artifact_name }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          retention-days: 7
      - name: Upload N-API artifact
        uses: actions/upload-artifact@v5
        with:
          name: napi-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.napi_artifact_name }}
          retention-days: 7

  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    needs: build
    outputs:
      version: ${{ steps.semifold.outputs['semifold-version'] }}
      publish: ${{ steps.semifold.outputs['semifold-publish'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Cache rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Configure npm provenance
        run: npm config set provenance true
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: semifold-*
          path: artifacts/
          merge-multiple: true
      - name: Download N-API artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: napi-*
          path: packages/cli/artifacts/
          merge-multiple: true
      - name: List artifacts
        run: ls -R artifacts/ packages/cli/artifacts/
      - name: Assemble and verify npm CLI packages
        run: |
          bun run --filter @semifold/cli create-npm-dirs
          bun run --filter @semifold/cli artifacts
          bun run --filter @semifold/cli check:artifacts
          bun run --filter @semifold/cli check:packs
      - name: Semifold CI
        id: semifold
        run: cargo run --bin semifold ci --debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
