name: Unit Test
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Cache rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install SDK dependencies
        run: pnpm install --frozen-lockfile --filter @semifold/plugin-sdk
      - name: Check plugin SDK
        run: pnpm --filter @semifold/plugin-sdk check
      - name: Test plugin SDK
        run: pnpm --filter @semifold/plugin-sdk test
      - name: Build
        run: cargo build --workspace
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Code lint
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace --verbose
