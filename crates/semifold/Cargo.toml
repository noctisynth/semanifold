[package]
name = "semifold"
version = "0.3.0-beta.3"
authors.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "semifold"
path = "src/main.rs"

[[bin]]
name = "smif"
path = "src/smif.rs"

[dependencies]
anyhow = "1.0.99"
bytes = "1.10.1"
camino = "1.2.4"
clap = { version = "4.5.45", features = ["derive"] }
colored = "3.0.0"
fern = "0.7.1"
git2 = { version = "0.20.2", features = ["vendored-openssl"] }
glob = "0.3.4"
inquire = "0.9.1"
log = "0.4.27"
minijinja = { version = "2.12.0", default-features = false, features = ["serde"] }
octocrab = "0.47.0"
reqwest = { version = "0.12.24", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
] }
rmcp = { version = "1.5", features = ["macros", "schemars", "transport-io"] }
rust-embed = "8.8.0"
rust-i18n = "3.1.5"
saphyr = "0.0.6"
schemars = "1.0"
semifold-changelog = { path = "../changelog", version = "0.3.0-beta.1" }
semifold-core = { version = "0.1.0-beta.1", path = "../semifold-core" }
semifold-resolver = { path = "../resolver", version = "0.4.0-beta.2", features = [
  "clap",
] }
semver = "1.0.27"
serde = "1.0.228"
serde_json = "1.0.145"
sys-locale = "0.3.2"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
toml_edit = "0.23.3"
