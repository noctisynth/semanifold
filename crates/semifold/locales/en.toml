[cli]
not_initialized = "Semifold is not initialized. Please run `semifold init` first."
dirty_repo = "Git repository is dirty. Please commit or stash your changes first, or use `--allow-dirty` option."

[cli.commands]
commit = "Commit a new changeset"
init = "Initialize Semifold changesets config in current repository"
version = "Bump package versions"
publish = "Publish packages with changes"
ci = "Run CI tasks of Semifold"
status = "Get status of Semifold changesets"
config = "Migrate and maintain Semifold configuration"
mcp = "Start MCP server"

[cli.flags]
dry_run = "Enable dry run mode"
debug = "Enable debug mode"

[cli.commit]
warn_incomplete_select = "Not all selected packages are bumped, continue?"
query_name = "What is the name of the commit?"
query_packages = "Which packages to include?"
query_tags = "Which tag should this change be under?"
query_pkg_bump = "Which packages should be %{level} bumped?"
help_major = "Major version bump means incompatible API changes."
help_minor = "Minor version bump means backward-compatible new features."
help_patch = "Patch version bump means backward-compatible bug fixes."
query_summary = "Summary of changes:"
empty_name = "Commit name cannot be empty"
commit_exists = "Commit with name %{name} already exists"
warn_no_packages = "No packages selected"
empty_summary = "Summary cannot be empty"

[cli.commit.flags]
name = "Name of the changeset to commit"
level = "Level of version bump"
summary = "Summary of changes"

[cli.init]
already_initialized = "Semifold is already initialized. If you want to re-initialize, please use the `--force` option."
not_repo_root = "Current directory is not the root of the repository."
continue = "Continue?"
aborted = "Aborted."
target = "What is the target directory?"
resolvers = "Which workspace resolvers to use?"
tags = "Add default tags to config?"
base_branch = "What is the base branch?"
release_branch = "What is the release branch?"
write_ci = "Write GitHub Actions workflows?"
discovery_failed = "Package discovery failed: %{error}"

[cli.init.flags]
target = "Target directory to store changesets"
resolvers = "Resolvers to use for workspace resolution"
force = "Force re-initialize Semifold"
base_branch = "Base branch to use for release"
release_branch = "Release branch to use for release"

[cli.status]
changesets = "%{count} changesets found"
packages = "The following packages will be bumped:"
no_packages = "No packages to bump"
pre_release_warning = "%{package} is currently in a pre-release mode, but a non-patch bump is being attempted."
pre_release_warning_header = "Warnings:"
plan_failed = "Failed to build release plan: %{error}"

[cli.status.flags]
comment = "Create GitHub pull request comments, only available in CI environment"

[cli.version]
no_git_repo = "No Git repository found"
empty_changesets = "No changesets found, skipping versioning"
unchanged = "%{package} is unchanged, skipping versioning"
skip_post_version = "Skipping post-version command %{command} for %{package} due to dry run"
run_post_version = "Running post-version command %{command} for %{package}"
no_resolver_config = "No resolver config found for %{resolver}, failed to run post-version for %{package}"

[cli.version.flags]
allow_dirty = "Allow versioning packages with dirty Git working tree"

[cli.publish]
skip_private = "Skip publishing %{package} %{version} as it is private"
pre_check = "Pre-check passed for %{package} %{version}, skipping publish"

[cli.publish.flags]
github_release = "Create GitHub releases for published packages, only available in CI environment"
allow_dirty = "Allow publishing packages with dirty Git working tree"

[cli.ci]
not_ci_environment = "Not running in CI environment"
git_repo_not_initialized = "Git repository is not initialized"
github_repo_invalid_format = "GITHUB_REPOSITORY is not in the format owner/repo"
not_base_branch = "Not a push to base branch, skip versioning and publishing."
no_changesets_publish = "No changesets found, will publish the current version."
no_existing_pr = "No existing PR found, create a new one."
existing_pr_found = "Existing PR #%{number} found, skip creating a new one."

[cli.mcp]
not_initialized = "Semifold not initialized. Run 'smif init' first."
changeset_dir_not_found = "Changeset directory not found. Run 'smif init' first."
package_not_found = "Package '%{package}' not found in config"
invalid_level = "Invalid level '%{level}'. Use: major, minor, patch"
changeset_created = "Changeset created: %{name}"
instructions = """Semifold MCP Server

Available tools:
- get_tags: Get all available tags
- get_packages: Get all packages in the project
- create_changeset: Create a new changeset based on the packages affected by this change and the version bump level"""

[cli.mcp.flags]
current_dir = "Current working directory for MCP server"

[cli.mcp.tools]
get_tags = "Get all available tags"
get_packages = "Get all available packages"
create_changeset = "Create a new changeset based on the packages affected by this change and the version bump level"

[cli.mcp.params]
name = "Name"
name_desc = "A unique identifier for this changeset"
packages = "Packages"
packages_desc = "Packages that will be bumped in this changeset"
level = "Level"
level_desc = "Must be one of: major, minor, or patch"
summary = "Summary"
summary_desc = "Brief description of what changed"
tag = "Tag"
tag_desc = "Optional tag to categorize this changeset, defaults to first available tag"

[cli.config]
command_migrate = "config migrate"
command_channel = "config channel"
not_found = "Semifold configuration was not found"
unsupported_format = "%{command} supports only TOML configuration files"
channel_set_requires_named = "Channel set requires a non-empty named channel; use clear for stable"
channels_already_match = "Package channels already match the requested state."
updating_channel = "Updating channel to %{channel} for: %{packages}"
channels_mismatch = "Package channels do not match the requested state"
updated = "Updated %{path}."
migration_not_required = "Configuration does not need migration."
migration_required = "Configuration migration required for: %{packages}"
migration_required_error = "Configuration migration is required"
migrated = "Migrated %{path}."
missing_packages_table = "Configuration is missing the [packages] table"
channel_legacy_conflict = "Package %{package} contains both channel and version-mode"
invalid_legacy_version_mode = "Package %{package} has an invalid version-mode"
package_not_configured = "Package %{package} is not configured"
package_must_be_table = "Package %{package} must be a table"
create_temporary_failed = "Failed to create temporary config %{path}"

[cli.config.commands]
migrate = "Migrate legacy version-mode fields to release channels"
channel = "Set or clear package release channels"
channel_set = "Set packages to a named release channel"
channel_clear = "Return packages to the default stable channel"

[cli.config.flags]
check_migration = "Report whether migration is required without writing the configuration"
channel = "Named release channel to set, such as alpha or beta"
package = "Package ID to update. May be repeated"
all = "Update every configured package"
check_channel = "Check whether the requested channel state is already configured"
