[cli.mcp]
instructions = """Semifold MCP Server

Available tools:
- get_changeset: Read one changeset by ID, or list all changesets
- create_changeset: Create a changeset idempotently
- update_changeset: Replace a changeset after verifying its revision
- delete_changeset: Delete a changeset after verifying its revision"""

[cli.mcp.flags]
project_root = "Project directory used by the MCP server"

[cli.mcp.tools]
get_changeset = "Read one changeset by ID, or list all changesets when no ID is provided"
create_changeset = "Create a changeset idempotently with an explicit bump and optional tag for each package"
update_changeset = "Replace a changeset only when its SHA-256 revision still matches"
delete_changeset = "Delete a changeset only when its SHA-256 revision still matches"

